name: CI

on:
  push:
    branches: [development]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: touch .env
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer validate --no-interaction
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php artisan test
      - run: vendor/bin/pint --test
      - run: composer audit --locked --no-interaction
      - name: Reject runtime fixture markers
        working-directory: .
        run: |
          if git grep -n -E '(@tichub\.local|[[:space:]]Demo|Development seed|KPI_DATA|CHART_DATA|mockTicketRepository)' -- frontend/src backend/app backend/database/seeders; then
            echo 'Runtime fixture marker detected.'
            exit 1
          fi

  backend-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: apg_crm_test
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: apg_crm_test
      DB_USERNAME: root
      DB_PASSWORD: ci-root-password
      CACHE_STORE: array
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - run: touch .env
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Verify MySQL migration lifecycle
        run: |
          php artisan migrate:fresh --seed --force
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force
          php artisan migrate:status
          php artisan migrate:fresh --force
      - name: Run backend tests on MySQL
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm typecheck
      - run: corepack pnpm format:check
      - run: corepack pnpm build
      - run: corepack pnpm audit --prod --audit-level critical
