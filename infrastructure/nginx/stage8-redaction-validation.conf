worker_processes 1;
error_log logs/error.log notice;
pid logs/nginx.pid;

events {
    worker_connections 64;
}

http {
    map $uri $crm_safe_uri {
        ~^/track/[^/]+(?:/.*)?$ /track/[REDACTED];
        ~^/api/v1/public/tickets/track/[^/]+/actions/(?<action_path>[^/?]+)$ /api/v1/public/tickets/track/[REDACTED]/actions/$action_path;
        ~^/api/v1/public/tickets/track/[^/]+(?:/.*)?$ /api/v1/public/tickets/track/[REDACTED];
        default $uri;
    }

    log_format crm_safe '$request_method $crm_safe_uri $status';

    server {
        listen 127.0.0.1:18080;
        access_log logs/access.log crm_safe;

        location / {
            return 204;
        }
    }
}
